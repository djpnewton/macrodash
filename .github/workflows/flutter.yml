# This is a basic workflow to help you get started with Actions

name: flutter

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SERVER_URL: https://macrodash-server.fly.dev
      LINK_PREVIEW_URL: https://ln.macrodash.me

    steps:
      - uses: actions/checkout@v4
      - name: Insert git sha
        run: |
          sed -i -e "s|GIT_SHA_REPLACE|$GITHUB_SHA|g" lib/config.dart
      - name: Insert build date
        run: |
          sed -i -e "s|BUILD_DATE_REPLACE|$(date)|g" lib/config.dart
      - name: Insert server url
        run: |
          sed -i -e "s|http://localhost:8080|${{ env.SERVER_URL }}|g" lib/config.dart
      - name: Insert link preview url
        run: |
          sed -i -e "s|LINK_PREVIEW_URL_REPLACE|${{ env.LINK_PREVIEW_URL }}|g" lib/config.dart
      - name: Insert client cache busting
        run: |
          sed -i -e "s|CLIENT_VERSION_REPLACE|$(date +%s)|g" web/index.html
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
      - run: flutter pub get
      - name: Analyze and test macrodash_models
        working-directory: macrodash_models
        run: |
          dart pub get
          dart format --set-exit-if-changed .
          dart analyze
          dart test
      - name: Analyze and test macrodash_preview
        working-directory: macrodash_preview
        run: |
          dart pub get
          dart format --set-exit-if-changed .
          dart analyze
          dart test
      #- run: flutter test
      - run: dart format --set-exit-if-changed lib
      - run: flutter analyze
      - if: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
        uses: bluefireteam/flutter-gh-pages@v9
        with:
          compileToWasm: false # web.dart doesnt seem to work on chrome with wasm

  test-deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      SERVER_URL: https://macrodash-server.fly.dev
      LINK_PREVIEW_URL: https://ln.macrodash.me

    steps:
      - uses: actions/checkout@v4
      - name: Insert git sha
        run: |
          sed -i -e "s|GIT_SHA_REPLACE|$GITHUB_SHA|g" lib/config.dart
      - name: Insert build date
        run: |
          sed -i -e "s|BUILD_DATE_REPLACE|$(date)|g" lib/config.dart
      - name: Insert server url
        run: |
          sed -i -e "s|http://localhost:8080|${{ env.SERVER_URL }}|g" lib/config.dart
      - name: Insert link preview url
        run: |
          sed -i -e "s|LINK_PREVIEW_URL_REPLACE|${{ env.LINK_PREVIEW_URL }}|g" lib/config.dart
      - name: Insert client cache busting
        run: |
          sed -i -e "s|CLIENT_VERSION_REPLACE|$(date +%s)|g" web/index.html
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
      - run: flutter build web

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './build/web'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "*Deploy from GitHub Actions*"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
          # fail if PR from fork that cant access secrets
          fails-without-credentials: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1
