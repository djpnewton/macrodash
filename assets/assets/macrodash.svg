        fill="none"
        stroke="#34D399"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="15" cy="22" r="3" fill="#A7F3D0"/>
  <circle cx="49" cy="16" r="3" fill="#A7F3D0"/>
</svg>
