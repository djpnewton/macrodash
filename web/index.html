<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="MacroDash: markets, M2 money supply, government debt, bond rates and market caps in one dashboard."
  />
  <meta name="theme-color" content="#0B1B33" />

  <!-- Link previews (Open Graph + Twitter). Scrapers need absolute URLs. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MacroDash" />
  <meta property="og:title" content="MacroDash" />
  <meta
    property="og:description"
    content="Markets, M2 money supply, government debt, bond rates and market caps in one dashboard."
  />
  <meta property="og:url" content="https://macrodash.me/" />
  <meta property="og:image" content="https://macrodash.me/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="MacroDash logo and dashboard preview" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MacroDash" />
  <meta
    name="twitter:description"
    content="Markets, M2 money supply, government debt, bond rates and market caps in one dashboard."
  />
  <meta name="twitter:image" content="https://macrodash.me/og-image.png" />
  <meta name="twitter:image:alt" content="MacroDash logo and dashboard preview" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MacroDash">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon. The SVG mark lives in assets/ and is served from the
       asset bundle; favicon.png stays as a fallback for older browsers. -->
  <link rel="icon" type="image/svg+xml" href="assets/assets/macrodash.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MacroDash</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js?v=CLIENT_VERSION_REPLACE" async></script>
</body>
</html>
